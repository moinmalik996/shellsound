name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build arm64 binary
        run: GOOS=darwin GOARCH=arm64 go build -o dist/fahh_alert-arm64 ./cmd/fahh_alert

      - name: Build amd64 binary
        run: GOOS=darwin GOARCH=amd64 go build -o dist/fahh_alert-amd64 ./cmd/fahh_alert

      - name: Create universal binary
        run: lipo -create -output dist/fahh_alert-darwin-universal dist/fahh_alert-arm64 dist/fahh_alert-amd64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/fahh_alert-darwin-universal \
            --title "${{ github.ref_name }}" \
            --generate-notes
